name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install dependencies
        run: bun install

      - name: Check
        run: bun oxlint && bun oxfmt src -- --check && bun run typecheck && bun test

      - name: Release
        if: github.event_name == 'push'
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          set -euo pipefail
          DECRYPTED=$(sops --decrypt secret.yaml)
          echo "$DECRYPTED" | yq -o json | jq -r 'to_entries[].value | strings' | while IFS= read -r val; do
            echo "::add-mask::$val"
          done
          export NPM_TOKEN=$(echo "$DECRYPTED" | yq -r '.npm_token')
          export GITHUB_TOKEN=$(echo "$DECRYPTED" | yq -r '.github_token')
          git config user.name "anakmagang"
          git config user.email "45801144+anakmagang@users.noreply.github.com"
          bunx semantic-release
