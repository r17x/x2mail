name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun oxlint

      - name: Format check
        run: bun oxfmt src -- --check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          set -euo pipefail
          DECRYPTED=$(sops --decrypt secret.yaml)
          echo "$DECRYPTED" | yq -o json | jq -r 'to_entries[].value | strings' | while IFS= read -r val; do
            echo "::add-mask::$val"
          done
          echo "NPM_TOKEN=$(echo "$DECRYPTED" | yq -r '.npm_token')" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=$(echo "$DECRYPTED" | yq -r '.github_token')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Release
        run: bunx semantic-release
        env:
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
